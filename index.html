    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (function() {
        try {
          // Immediately purge old demo storage keys from mobile Safari / Chrome
          localStorage.removeItem('health_survey_responses');
          localStorage.removeItem('health_survey_responses_v2');
          localStorage.removeItem('health_survey_responses_v3');
          localStorage.removeItem('health_survey_cache_version');
          
          // Invalidate mobile back-forward cache (BFCache)
          window.addEventListener('pageshow', function(e) {
            if (e && e.persisted) {
              window.location.reload();
            }
          });
        } catch(err) {}
      })();
    </script>
    <title>ระบบสำรวจความพึงพอใจ ศูนย์บริการสาธารณสุข 40 บางแค</title>
